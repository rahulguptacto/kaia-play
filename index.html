<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaia's World">
<title>Kaia's World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;touch-action:manipulation;}
#app{width:100%;height:100%;display:flex;flex-direction:column;}
#stage{flex:1;position:relative;overflow:hidden;cursor:pointer;}

/* ── Splash screen to unlock audio ── */
#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#FFB6C1,#E6B0FA,#87CEEB);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;cursor:pointer;}
#splash .big-emoji{font-size:120px;animation:splashBounce 1s ease-in-out infinite alternate;}
#splash .tap-text{font-size:24px;font-weight:800;color:white;text-shadow:0 2px 8px rgba(0,0,0,0.2);animation:splashPulse 1.5s ease-in-out infinite;}
#splash.hidden{display:none;}

.char-slot{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:8px;transition:left 3s ease-in-out,bottom 3s ease-in-out,transform 0.2s ease-out,opacity 0.15s ease-out;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3));}
.char-slot.active{filter:drop-shadow(0 0 20px rgba(255,255,100,0.7));}
.char-slot.idle{animation:idleFloat 2.5s ease-in-out infinite;}

#bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px 10px;background:linear-gradient(180deg,rgba(0,0,0,0.15),rgba(0,0,0,0.35));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,0.1);z-index:100;padding-bottom:max(10px,env(safe-area-inset-bottom));overflow-x:auto;-webkit-overflow-scrolling:touch;}
#bar button{border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;}
.scene-btn{width:38px;height:38px;font-size:17px;border:2px solid rgba(255,255,255,0.15)!important;background:rgba(255,255,255,0.06);}
.scene-btn.on{border-color:white!important;background:rgba(255,255,255,0.3);}
.action-btn{width:56px;height:56px;font-size:26px;border:3px solid rgba(255,255,255,0.2)!important;background:rgba(255,255,255,0.1);}
.action-btn.on{border-color:white!important;background:linear-gradient(135deg,#FFD93D,#FF6B9D);transform:scale(1.15);box-shadow:0 0 25px rgba(255,107,157,0.5);}
.learn-btn{width:56px;height:56px;font-size:26px;border:3px solid rgba(100,200,255,0.3)!important;background:rgba(100,200,255,0.1);}
.learn-btn.on{border-color:#4CC9F0!important;background:linear-gradient(135deg,#4CC9F0,#A855F7);transform:scale(1.15);box-shadow:0 0 25px rgba(76,201,240,0.5);}
.music-btn{width:44px;height:44px;font-size:20px;border:3px solid rgba(255,255,255,0.2)!important;background:rgba(255,255,255,0.08);}
.music-btn.on{border-color:#FFD700!important;background:linear-gradient(135deg,#FFD93D,#FB5607);box-shadow:0 0 20px rgba(255,217,61,0.5);animation:musicPulse 0.6s ease-in-out infinite alternate;}
.divider{width:1px;height:36px;background:rgba(255,255,255,0.2);margin:0 2px;flex-shrink:0;}

#speech-bubble{position:absolute;top:4%;left:50%;transform:translateX(-50%);z-index:150;background:white;border-radius:24px;padding:12px 24px;box-shadow:0 6px 30px rgba(0,0,0,0.2);text-align:center;display:none;animation:popBounce 0.3s cubic-bezier(0.34,1.56,0.64,1);}
#speech-bubble.show{display:block;}
#speech-bubble .emoji{font-size:36px;}
#speech-bubble .dots{display:flex;gap:4px;justify-content:center;margin-top:4px;}
#speech-bubble .dot{width:10px;height:10px;border-radius:50%;background:#FF6B9D;}
#speech-bubble .dot:nth-child(1){animation:dotBounce 0.6s ease-in-out 0s infinite;}
#speech-bubble .dot:nth-child(2){animation:dotBounce 0.6s ease-in-out 0.15s infinite;}
#speech-bubble .dot:nth-child(3){animation:dotBounce 0.6s ease-in-out 0.3s infinite;}
#speech-bubble::after{content:'';position:absolute;bottom:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:white;}

.color-flash{position:absolute;inset:0;pointer-events:none;z-index:50;opacity:0;transition:opacity 0.3s;}
.color-flash.show{opacity:0.3;}
.learn-target{position:absolute;z-index:60;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;animation:targetPulse 1s ease-in-out infinite alternate;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.learn-prompt{position:absolute;top:8%;left:50%;transform:translateX(-50%);z-index:160;background:rgba(0,0,0,0.6);border-radius:20px;padding:10px 24px;display:none;animation:popBounce 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.learn-prompt.show{display:flex;align-items:center;gap:10px;}
.learn-prompt .prompt-emoji{font-size:40px;}
.learn-prompt .prompt-color{width:40px;height:40px;border-radius:50%;border:3px solid white;}

#stars-container{position:absolute;top:10px;right:10px;display:flex;gap:1px;flex-wrap:wrap;max-width:120px;z-index:100;}

.dj-booth{position:absolute;top:10px;left:10px;z-index:90;display:none;animation:djBounce 0.5s ease-in-out infinite alternate;}
.dj-booth.show{display:block;}

@keyframes idleFloat{0%,100%{transform:translate(-50%,0) translateY(0)}50%{transform:translate(-50%,0) translateY(-6px)}}
@keyframes overlayBounce{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(1.15) rotate(5deg)}}
@keyframes sparkleFloat{0%{opacity:0;transform:translate(-50%,-50%) scale(0)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(0.5) translateY(-20px)}}
@keyframes flashOut{0%{opacity:1;transform:scale(0.3)}100%{opacity:0;transform:scale(3)}}
@keyframes burstOut{0%{opacity:1;transform:translate(0,0) scale(0.3) rotate(0deg)}40%{opacity:1}100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(1.2) rotate(220deg)}}
@keyframes musicPulse{from{transform:scale(1)}to{transform:scale(1.15)}}
@keyframes starPop{0%{transform:scale(0) rotate(0)}60%{transform:scale(1.4) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}
@keyframes popBounce{0%{transform:translateX(-50%) scale(0)}60%{transform:translateX(-50%) scale(1.1)}100%{transform:translateX(-50%) scale(1)}}
@keyframes dotBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes targetPulse{0%{transform:scale(1)}100%{transform:scale(1.1)}}
@keyframes djBounce{0%{transform:translateY(0) rotate(-3deg)}100%{transform:translateY(-5px) rotate(3deg)}}
@keyframes splashBounce{0%{transform:scale(1) rotate(-5deg)}100%{transform:scale(1.15) rotate(5deg)}}
@keyframes splashPulse{0%,100%{opacity:1}50%{opacity:0.6}}
</style>
</head>
<body>
<div id="app">
  <!-- Splash screen: unlocks BOTH audio contexts on iOS with a single tap -->
  <div id="splash">
    <div class="big-emoji">🌸</div>
    <div class="tap-text">Tap to Start!</div>
    <div class="big-emoji" style="font-size:60px;animation-delay:0.3s;">🎵 ✨ 🐱</div>
  </div>
  <div id="stage"></div>
  <div id="bar"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
// ═══════════════════════════════════════════════════
// iOS AUDIO UNLOCK
// On iOS, BOTH speechSynthesis AND AudioContext must
// be triggered from the SAME synchronous user gesture.
// The splash screen tap handles this.
// ═══════════════════════════════════════════════════
let audioUnlocked = false;
let voiceUnlocked = false;
let selectedVoice = null;

// Load voices early
function loadVoices() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  // Peppy, higher-energy voices preferred
  selectedVoice =
    voices.find(v => v.name === 'Samantha') ||
    voices.find(v => v.name === 'Tessa') ||
    voices.find(v => v.name.includes('Google US English')) ||
    voices.find(v => v.lang === 'en-US' && v.localService) ||
    voices.find(v => v.lang.startsWith('en')) ||
    voices[0];
}
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}
// Retry loading
setTimeout(loadVoices, 200);
setTimeout(loadVoices, 1000);
setTimeout(loadVoices, 2000);

// The critical splash tap handler — SYNCHRONOUS user gesture
document.getElementById('splash').addEventListener('touchstart', handleSplashTap, {passive:false});
document.getElementById('splash').addEventListener('click', handleSplashTap);

function handleSplashTap(e) {
  e.preventDefault();
  
  // ── 1. Unlock Web Speech API (MUST be synchronous in tap handler) ──
  if (!voiceUnlocked) {
    loadVoices();
    const u = new SpeechSynthesisUtterance('Hello Kaia!');
    u.pitch = 1.7;
    u.rate = 1.05;
    u.volume = 1;
    if (selectedVoice) u.voice = selectedVoice;
    u.onstart = () => showSpeechBubble(true);
    u.onend = () => { showSpeechBubble(false); voiceUnlocked = true; };
    u.onerror = () => { showSpeechBubble(false); voiceUnlocked = true; };
    speechSynthesis.speak(u);
    voiceUnlocked = true;
  }
  
  // ── 2. Unlock Tone.js AudioContext ──
  Tone.start().then(() => {
    audioUnlocked = true;
    initAudio();
  });
  
  // Hide splash
  document.getElementById('splash').classList.add('hidden');
}

// ═══════════════════════════════════════════════════
// VOICE ENGINE — peppy, high energy for a 2-year-old
// ═══════════════════════════════════════════════════
const Voice = {
  say(text, pitch, rate) {
    if (!voiceUnlocked) return;
    loadVoices();
    speechSynthesis.cancel();
    // Small delay after cancel for iOS
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      u.pitch = Math.min(Math.max(pitch || 1.7, 0.1), 2);  // Higher pitch = peppier
      u.rate = Math.min(Math.max(rate || 1.05, 0.1), 2);    // Slightly faster = more energy
      u.volume = 1;
      if (selectedVoice) u.voice = selectedVoice;
      u.onstart = () => showSpeechBubble(true);
      u.onend = () => showSpeechBubble(false);
      u.onerror = () => showSpeechBubble(false);
      speechSynthesis.speak(u);
    }, 80);
  }
};

// ═══════════════════════════════════════════════════
// TONE.JS SOUND ENGINE
// ═══════════════════════════════════════════════════
let audioReady=false, xylo, bell, bounce, pluck, sparkSynth, whoosh, kick, hat, bass, pad;
async function initAudio(){
  if(audioReady)return;
  xylo=new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:0.001,decay:0.35,sustain:0,release:0.25},volume:-3}).toDestination();
  const xv=new Tone.Reverb({decay:1.2,wet:0.25}).toDestination();xylo.disconnect();xylo.connect(xv);
  bell=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'triangle'},envelope:{attack:0.008,decay:0.5,sustain:0.08,release:0.7},volume:-5}).toDestination();
  bounce=new Tone.MembraneSynth({pitchDecay:0.06,octaves:5,volume:-8}).toDestination();
  pluck=new Tone.PluckSynth({volume:-4}).toDestination();
  sparkSynth=new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:0.001,decay:0.15,sustain:0,release:0.1},volume:-6}).toDestination();
  const sv=new Tone.Reverb({decay:2,wet:0.4}).toDestination();sparkSynth.disconnect();sparkSynth.connect(sv);
  whoosh=new Tone.NoiseSynth({noise:{type:'pink'},envelope:{attack:0.05,decay:0.25,sustain:0,release:0.1},volume:-14}).toDestination();
  kick=new Tone.MembraneSynth({pitchDecay:0.05,octaves:6,volume:-10}).toDestination();
  hat=new Tone.NoiseSynth({noise:{type:'white'},envelope:{attack:0.001,decay:0.04,sustain:0,release:0.02},volume:-18}).toDestination();
  bass=new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.05,decay:0.2,sustain:0.3,release:0.15},volume:-12}).toDestination();
  pad=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'sine'},envelope:{attack:0.3,decay:0.8,sustain:0.4,release:1.0},volume:-20}).toDestination();
  audioReady=true;
}

const SFX={
  tap(xR){if(!audioReady)return;const s=['C4','D4','E4','G4','A4','C5','D5','E5','G5','A5','C6'];xylo.triggerAttackRelease(s[Math.min(Math.floor(xR*s.length),s.length-1)],'8n');},
  peekHide(){if(!audioReady)return;const n=Tone.now();['G5','E5','C5','G4'].forEach((x,i)=>sparkSynth.triggerAttackRelease(x,0.1,n+i*0.08));whoosh.triggerAttackRelease('8n',n+0.1);},
  peekReveal(){if(!audioReady)return;const n=Tone.now();bounce.triggerAttackRelease('C2','4n',n);['C4','E4','G4','C5','E5','G5','C6'].forEach((x,i)=>bell.triggerAttackRelease([x],0.1,n+i*0.06));},
  danceBeat(){if(!audioReady)return;bounce.triggerAttackRelease('C2','16n');xylo.triggerAttackRelease(['C5','D5','E5','G5','A5'][Math.floor(Math.random()*5)],'16n',Tone.now()+0.05);},
  jumpUp(){if(!audioReady)return;const n=Tone.now();['C4','E4','G4','C5','E5'].forEach((x,i)=>sparkSynth.triggerAttackRelease(x,0.08,n+i*0.04));whoosh.triggerAttackRelease('16n',n);},
  jumpLand(){if(!audioReady)return;bounce.triggerAttackRelease('C2','8n');setTimeout(()=>bell.triggerAttackRelease(['C4','E4','G4'],0.15),100);},
  spinSound(){if(!audioReady)return;const n=Tone.now();whoosh.triggerAttackRelease('4n',n);['C5','D5','E5','F5','G5','A5','B5','C6'].forEach((x,i)=>sparkSynth.triggerAttackRelease(x,0.06,n+i*0.08));},
  wiggle(){if(!audioReady)return;const n=Tone.now();['E5','G5','E5','G5','E5','G5','C6'].forEach((x,i)=>xylo.triggerAttackRelease(x,'32n',n+i*0.07));},
  celebration(){if(!audioReady)return;const n=Tone.now();bounce.triggerAttackRelease('C2','4n',n);['C4','E4','G4','C5'].forEach((x,i)=>bell.triggerAttackRelease([x],0.15,n+i*0.1));setTimeout(()=>['E5','G5','C6','E6'].forEach((x,i)=>sparkSynth.triggerAttackRelease(x,0.1,Tone.now()+i*0.06)),400);},
  correct(){if(!audioReady)return;const n=Tone.now();['C5','E5','G5','C6'].forEach((x,i)=>bell.triggerAttackRelease([x],0.12,n+i*0.08));},
  wrong(){if(!audioReady)return;bounce.triggerAttackRelease('E2','8n');},
  charVoice(id){if(!audioReady)return;const n=Tone.now();const p={luna:()=>['E5','G5','B5','E6'].forEach((x,i)=>bell.triggerAttackRelease([x],0.15,n+i*0.09)),benny:()=>{bounce.triggerAttackRelease('C2','8n',n);setTimeout(()=>bell.triggerAttackRelease(['C4','E4','G4'],0.2),150);},sunny:()=>['C5','E5','G5','C6','E6'].forEach((x,i)=>sparkSynth.triggerAttackRelease(x,0.12,n+i*0.07)),pippa:()=>['G4','E4','G4','C5','E5'].forEach((x,i)=>pluck.triggerAttack(x,n+i*0.1)),rosie:()=>['C4','E4','G4','B4','D5','G5'].forEach((x,i)=>bell.triggerAttackRelease([x],0.12,n+i*0.08))};(p[id]||p.luna)();}
};

function toggleMusic(mode){
  if(!audioReady)return false;const t=Tone.getTransport();
  if(t.state==='started'){t.stop();t.cancel();return false;}
  if(mode==='reggaeton'){
    t.bpm.value=95;let bi=0,mi=0;const bn=['C2','C2','G2','G2'];
    t.scheduleRepeat(time=>kick.triggerAttackRelease('C1','16n',time),'4n');
    t.scheduleRepeat(time=>kick.triggerAttackRelease('G1','16n',time),{interval:'4n',offset:'4n + 8n'});
    t.scheduleRepeat(time=>hat.triggerAttackRelease('32n',time),'8n');
    t.scheduleRepeat(time=>bass.triggerAttackRelease(bn[bi++%bn.length],'8n',time),'2n');
    t.scheduleRepeat(time=>pluck.triggerAttack(['G4','C5','E5'][mi++%3],time),'4n');
    t.scheduleRepeat(time=>bell.triggerAttackRelease(['C4','E4','G4'],'8n',time,0.08),'1n');
  } else {
    t.bpm.value=112;
    const bn=['C2','C2','F2','F2','G2','G2','C2','C2'],mn=['C5','D5','E5','G5','A5','G5','E5','D5','C5','E5','G5','A5','G5','E5','D5','C5'],ch=[['C3','E3','G3'],['F3','A3','C4'],['G3','B3','D4'],['C3','E3','G3']];
    let bi=0,mi=0,ci=0;
    t.scheduleRepeat(time=>kick.triggerAttackRelease('C1','8n',time),'4n');
    t.scheduleRepeat(time=>hat.triggerAttackRelease('32n',time),'8n');
    t.scheduleRepeat(time=>bass.triggerAttackRelease(bn[bi++%bn.length],'8n',time),'4n');
    t.scheduleRepeat(time=>xylo.triggerAttackRelease(mn[mi++%mn.length],'8n',time),'8n');
    t.scheduleRepeat(time=>pad.triggerAttackRelease(ch[ci++%ch.length],'2n',time,0.1),'1n');
  }
  t.start();return true;
}

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
const pick=a=>a[Math.floor(Math.random()*a.length)];

// ═══════════════════════════════════════════════════
// CHARACTER SVGS
// ═══════════════════════════════════════════════════
const CHAR_SVGS={

function getJump(){const p=pick(["Jump jump jump!","Boing boing!","Up up up!","To the moon!","Wheee so high!"]);return [{d:250,s:{transform:'scaleX(1.15) scaleY(0.8) translateY(10px)'},speak:p},{d:150,s:{transform:'scaleX(1.2) scaleY(0.7) translateY(15px)'}},{d:200,s:{transform:'scaleX(0.85) scaleY(1.2) translateY(-80px)'},sfx:()=>SFX.jumpUp()},{d:300,s:{transform:'scaleX(0.9) scaleY(1.1) translateY(-100px)'},speak:'Wheee!',pitch:1.9,rate:1.2},{d:200,s:{transform:'scale(1.05) translateY(-95px)'}},{d:150,s:{transform:'scaleX(0.9) scaleY(1.1) translateY(-30px)'}},{d:100,s:{transform:'scaleX(1.25) scaleY(0.7) translateY(8px)'},sfx:()=>SFX.jumpLand(),sparkles:true},{d:200,s:{transform:'scaleX(0.95) scaleY(1.08) translateY(-25px)'}},{d:150,s:{transform:'scaleX(1.1) scaleY(0.85) translateY(4px)'}},{d:200,s:{transform:'scale(1) translateY(0)'}}];}

function startColorMode(){clearLearnTargets();learnMode='colors';const shuffled=[...COLORS_DATA].sort(()=>Math.random()-0.5).slice(0,3);const target=pick(shuffled);showLearnPrompt(target.emoji,target.hex);Voice.say(`Tap the ${target.name} one!`,1.7,1.0);shuffled.forEach((color,i)=>{const el=document.createElement('div');el.className='learn-target';const size=Math.min(stage.offsetWidth*0.22,120);el.style.width=size+'px';el.style.height=size+'px';el.style.background=color.hex;el.style.left=(15+i*30)+'%';el.style.top='35%';el.style.fontSize=(size*0.5)+'px';el.textContent=color.emoji;el.addEventListener('pointerdown',async e=>{e.stopPropagation();if(color.hex===target.hex){SFX.correct();Voice.say(`Yes! That's ${color.name}! Great job Kaia!`,1.8,1.1);el.style.transform='scale(1.4)';el.style.boxShadow=`0 0 40px ${color.hex}`;colorFlash.style.background=color.hex;colorFlash.classList.add('show');setTimeout(()=>colorFlash.classList.remove('show'),800);setTimeout(()=>startColorMode(),2500);}else{SFX.wrong();el.style.opacity='0.3';Voice.say(`That's ${color.name}. Try again! Find ${target.name}!`,1.6,1.0);}});stage.appendChild(el);learnTargets.push(el);});}

function startAnimalMode(){clearLearnTargets();learnMode='animals';const animal=pick(ANIMALS_DATA);const el=document.createElement('div');el.className='learn-target';const size=Math.min(stage.offsetWidth*0.35,180);el.style.width=size+'px';el.style.height=size+'px';el.style.left='50%';el.style.top='35%';el.style.transform='translateX(-50%)';el.style.fontSize=(size*0.6)+'px';el.style.background='rgba(255,255,255,0.2)';el.style.backdropFilter='blur(8px)';el.style.webkitBackdropFilter='blur(8px)';el.textContent=animal.emoji;Voice.say(animal.speak,1.7,0.9);el.addEventListener('pointerdown',async e=>{e.stopPropagation();SFX.charVoice(pick(CHAR_IDS));Voice.say(animal.speak,1.8,1.0);el.style.transform='translateX(-50%) scale(1.3) rotate(10deg)';setTimeout(()=>{el.style.transform='translateX(-50%) scale(1)';},300);setTimeout(()=>startAnimalMode(),3000);});stage.appendChild(el);learnTargets.push(el);}

function startCountingMode(){clearLearnTargets();learnMode='counting';countingCount=0;Voice.say("Let's count! Tap the screen!",1.7,1.0);showLearnPrompt('🔢',null);}

function clearLearnTargets(){learnTargets.forEach(el=>el.remove());learnTargets=[];hideLearnPrompt();learnMode=null;}

// ═══════════════════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════════════════
const CHAR_IDS=['luna','benny','sunny','pippa','rosie'];
const CHAR_SIZES={luna:115,benny:115,sunny:95,pippa:110,rosie:110};
let currentScene=0,stars=0,busy={},charPos={luna:{x:10,y:6},benny:{x:28,y:10},sunny:{x:48,y:15},pippa:{x:68,y:8},rosie:{x:86,y:11}},charTimers={};

// ═══════════════════════════════════════════════════
// DOM SETUP
// ═══════════════════════════════════════════════════
const stage=document.getElementById('stage'),bar=document.getElementById('bar');

const bub=document.createElement('div');bub.id='speech-bubble';bub.innerHTML='<div class="emoji">🗣️</div><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';stage.appendChild(bub);
function showSpeechBubble(show){if(show){bub.classList.add('show');bub.style.animation='none';bub.offsetHeight;bub.style.animation='';}else bub.classList.remove('show');}

const colorFlash=document.createElement('div');colorFlash.className='color-flash';stage.appendChild(colorFlash);

const learnPrompt=document.createElement('div');learnPrompt.className='learn-prompt';learnPrompt.innerHTML='<span class="prompt-emoji"></span><span class="prompt-color"></span>';stage.appendChild(learnPrompt);
function showLearnPrompt(emoji,hex){learnPrompt.querySelector('.prompt-emoji').textContent=emoji;const cs=learnPrompt.querySelector('.prompt-color');if(hex){cs.style.background=hex;cs.style.display='block';}else cs.style.display='none';learnPrompt.classList.add('show');}
function hideLearnPrompt(){learnPrompt.classList.remove('show');}

const starsEl=document.createElement('div');starsEl.id='stars-container';stage.appendChild(starsEl);

const djBooth=document.createElement('div');djBooth.className='dj-booth';djBooth.innerHTML=COOL_BUNNY_SVG;stage.appendChild(djBooth);

const floatersEl=document.createElement('div');floatersEl.style.cssText='position:absolute;inset:0;pointer-events:none;';stage.appendChild(floatersEl);

const charEls={};
CHAR_IDS.forEach(id=>{const el=document.createElement('div');el.className='char-slot idle';el.innerHTML=CHAR_SVGS[id](CHAR_SIZES[id]);el.style.left=charPos[id].x+'%';el.style.bottom=charPos[id].y+'%';el.style.transform='translate(-50%,0)';el.addEventListener('pointerdown',e=>{e.stopPropagation();if(!busy[id])triggerCharRoutine(id);});stage.appendChild(el);charEls[id]=el;});

// ═══════════════════════════════════════════════════
// ROUTINE PLAYER
// ═══════════════════════════════════════════════════
function playRoutine(charId,steps){if(charTimers[charId])charTimers[charId].forEach(clearTimeout);charTimers[charId]=[];const el=charEls[charId];el.classList.remove('idle');el.classList.add('active');let elapsed=0;steps.forEach(step=>{const tid=setTimeout(()=>{Object.assign(el.style,step.s);if(step.sfx)step.sfx();if(step.speak)Voice.say(step.speak,step.pitch||1.7,step.rate||1.05);let ov=el.querySelector('.peek-overlay');if(step.overlay){if(!ov){ov=document.createElement('div');ov.className='peek-overlay';ov.style.cssText='position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-size:70px;z-index:40;animation:overlayBounce 0.8s ease-in-out infinite alternate;';el.appendChild(ov);}ov.textContent=step.overlay;}else if(ov)ov.remove();if(step.sparkles){const ring=document.createElement('div');ring.className='sparkle-ring';ring.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:35;';const emojis=['✨','⭐','🌟','💫'];for(let i=0;i<12;i++){const sp=document.createElement('div');sp.className='sparkle-item';const a=(i/12)*Math.PI*2,d=65+Math.random()*20;sp.style.cssText=`position:absolute;left:calc(50% + ${Math.cos(a)*d}px);top:calc(45% + ${Math.sin(a)*d}px);font-size:${16+Math.random()*10}px;animation:sparkleFloat 1s ease-out ${i*0.04}s both;transform:translate(-50%,-50%);`;sp.textContent=emojis[i%4];ring.appendChild(sp);}el.appendChild(ring);setTimeout(()=>ring.remove(),1200);}},elapsed);charTimers[charId].push(tid);elapsed+=step.d;});const endTid=setTimeout(()=>{el.style.transform='translate(-50%,0)';el.style.opacity='1';el.classList.remove('active');el.classList.add('idle');const ov=el.querySelector('.peek-overlay');if(ov)ov.remove();busy[charId]=false;},elapsed);charTimers[charId].push(endTid);return elapsed;}

function triggerCharRoutine(charId){const action=pick(ACTIONS);busy[charId]=true;SFX.charVoice(charId);playRoutine(charId,action.get());}

// ═══════════════════════════════════════════════════
// TAP BURST
// ═══════════════════════════════════════════════════
const BURST_EMOJIS=['⭐','✨','💖','🌟','🎉','💫','🌈','🦋','🎀','💕','🌸','🎊'];
function createBurst(x,y){const c=document.createElement('div');c.style.cssText=`position:absolute;left:${x}px;top:${y}px;pointer-events:none;z-index:200;`;const f=document.createElement('div');f.style.cssText='position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,100,0.9) 0%,rgba(255,100,200,0.5) 40%,transparent 70%);animation:flashOut 0.6s ease-out forwards;';c.appendChild(f);for(let i=0;i<10;i++){const em=document.createElement('div');const a=(i/10)*Math.PI*2+(Math.random()-0.5)*0.3,d=50+Math.random()*80;em.style.cssText=`position:absolute;font-size:${22+Math.random()*20}px;left:-12px;top:-12px;animation:burstOut 0.8s ease-out ${Math.random()*0.06}s forwards;opacity:0;`;em.style.setProperty('--bx',Math.cos(a)*d+'px');em.style.setProperty('--by',Math.sin(a)*d+'px');em.textContent=pick(BURST_EMOJIS);c.appendChild(em);}stage.appendChild(c);setTimeout(()=>c.remove(),900);}

// ═══════════════════════════════════════════════════
// STAGE TAP
// ═══════════════════════════════════════════════════
stage.addEventListener('pointerdown',e=>{
  if(!audioReady)return;
  const rect=stage.getBoundingClientRect(),cx=e.clientX-rect.left,cy=e.clientY-rect.top;
  SFX.tap(cx/rect.width);
  createBurst(cx,cy);
  stars++;
  if(learnMode==='counting'){
    countingCount++;
    const emoji=pick(COUNTING_EMOJIS);
    const el=document.createElement('div');el.style.cssText=`position:absolute;left:${cx-30}px;top:${cy-30}px;font-size:60px;pointer-events:none;z-index:100;animation:starPop 0.5s ease-out;`;el.textContent=emoji;stage.appendChild(el);setTimeout(()=>el.remove(),1500);
    if(countingCount<=10){const words=['','One!','Two!','Three!','Four!','Five!','Six!','Seven!','Eight!','Nine!','Ten!'];Voice.say(words[countingCount],1.8,1.1);if(countingCount===10){setTimeout(()=>{Voice.say("Yay! You counted to ten! Great job Kaia!",1.8,1.0);SFX.celebration();countingCount=0;},1500);}}else{countingCount=1;Voice.say("One!",1.8,1.1);}
    return;
  }
  if(stars%5===0){SFX.celebration();Voice.say(pick(["Yay Kaia!","You're amazing!","Superstar!","Wonderful!"]),1.8,1.1);addStar();}
});

function addStar(){const s=document.createElement('span');s.textContent='⭐';s.style.cssText='font-size:18px;animation:starPop 0.4s ease-out;';starsEl.appendChild(s);if(starsEl.children.length>20)starsEl.firstChild.remove();}

// ═══════════════════════════════════════════════════
// SCENE, FLOATERS, AUTO-WANDER, AUTO-DIRECTOR
// ═══════════════════════════════════════════════════
let floaterData=[];
function setScene(idx){currentScene=idx;stage.style.background=SCENES[idx].bg;updateFloaters();document.querySelectorAll('.scene-btn').forEach((b,i)=>b.classList.toggle('on',i===idx));}
function updateFloaters(){floatersEl.innerHTML='';floaterData=SCENES[currentScene].floats.map(emoji=>{const el=document.createElement('div');el.className='floater';el.textContent=emoji;const d={el,x:Math.random()*85+5,y:Math.random()*30+5,phase:Math.random()*Math.PI*2,speed:0.2+Math.random()*0.4,size:26+Math.random()*18};el.style.fontSize=d.size+'px';el.style.left=d.x+'%';el.style.top=d.y+'%';floatersEl.appendChild(el);return d;});}
setInterval(()=>{floaterData.forEach(f=>{f.phase+=0.02*f.speed;f.x+=Math.sin(f.phase)*0.1;f.el.style.left=f.x+'%';f.el.style.top=(f.y+Math.sin(f.phase)*2)+'%';});},50);

const CB={luna:{xMin:3,xMax:18,yMin:3,yMax:18},benny:{xMin:20,xMax:38,yMin:3,yMax:18},sunny:{xMin:40,xMax:58,yMin:6,yMax:22},pippa:{xMin:60,xMax:78,yMin:3,yMax:18},rosie:{xMin:78,xMax:95,yMin:3,yMax:18}};
setInterval(()=>{CHAR_IDS.forEach(id=>{if(busy[id])return;const b=CB[id],p=charPos[id];p.x=Math.max(b.xMin,Math.min(b.xMax,p.x+(Math.random()-0.5)*5));p.y=Math.max(b.yMin,Math.min(b.yMax,p.y+(Math.random()-0.5)*5));charEls[id].style.left=p.x+'%';charEls[id].style.bottom=p.y+'%';});},3000);

setInterval(()=>{if(learnMode)return;const avail=CHAR_IDS.filter(c=>!busy[c]);if(!avail.length||!audioReady)return;const charId=pick(avail);busy[charId]=true;playRoutine(charId,getAutoRoutine(pick(AUTO_PHRASES)));},10000);

setInterval(()=>{if(!learnMode)setScene((currentScene+1)%SCENES.length);},30000);

// ═══════════════════════════════════════════════════
// BUILD BOTTOM BAR
// ═══════════════════════════════════════════════════
SCENES.forEach((sc,i)=>{const btn=document.createElement('button');btn.className='scene-btn'+(i===0?' on':'');btn.textContent=sc.emoji;btn.addEventListener('pointerdown',e=>{e.stopPropagation();SFX.tap(0.5);clearLearnTargets();setScene(i);});bar.appendChild(btn);});
bar.appendChild(Object.assign(document.createElement('div'),{className:'divider'}));
ACTIONS.forEach((act,i)=>{const btn=document.createElement('button');btn.className='action-btn';btn.textContent=act.emoji;btn.addEventListener('pointerdown',e=>{e.stopPropagation();clearLearnTargets();btn.classList.add('on');setTimeout(()=>btn.classList.remove('on'),500);CHAR_IDS.forEach((charId,j)=>{setTimeout(()=>{busy[charId]=true;playRoutine(charId,act.get());},j*200);});});bar.appendChild(btn);});
bar.appendChild(Object.assign(document.createElement('div'),{className:'divider'}));
[{emoji:'🎨',action:startColorMode},{emoji:'🐮',action:startAnimalMode},{emoji:'🔢',action:startCountingMode}].forEach(lb=>{const btn=document.createElement('button');btn.className='learn-btn';btn.textContent=lb.emoji;btn.addEventListener('pointerdown',e=>{e.stopPropagation();document.querySelectorAll('.learn-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');lb.action();});bar.appendChild(btn);});
bar.appendChild(Object.assign(document.createElement('div'),{className:'divider'}));

const musicNorm=document.createElement('button');musicNorm.className='music-btn';musicNorm.textContent='🎵';
const musicReg=document.createElement('button');musicReg.className='music-btn';musicReg.textContent='🐰';
musicNorm.addEventListener('pointerdown',e=>{e.stopPropagation();const t=Tone.getTransport();if(t.state==='started'){t.stop();t.cancel();musicNorm.classList.remove('on');musicReg.classList.remove('on');djBooth.classList.remove('show');return;}const on=toggleMusic('normal');musicNorm.classList.toggle('on',on);musicReg.classList.remove('on');djBooth.classList.remove('show');if(on)Voice.say("Music time!",1.8,1.1);});
musicReg.addEventListener('pointerdown',e=>{e.stopPropagation();const t=Tone.getTransport();if(t.state==='started'){t.stop();t.cancel();musicReg.classList.remove('on');musicNorm.classList.remove('on');djBooth.classList.remove('show');return;}const on=toggleMusic('reggaeton');musicReg.classList.toggle('on',on);musicNorm.classList.remove('on');djBooth.classList.toggle('show',on);if(on)Voice.say("DJ Bunny in the house! Let's go!",1.7,1.1);});
bar.appendChild(musicNorm);bar.appendChild(musicReg);

setScene(0);
</script>
</body>
</html>
